<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carpool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  </head>
  <body class="bg-white">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useEffect, useRef, useState } = React;

      const uid = () => Math.random().toString(36).slice(2, 9);

      const toB64 = (o) => {
        const bytes = new TextEncoder().encode(JSON.stringify(o));
        let bin = '';
        bytes.forEach((b) => (bin += String.fromCharCode(b)));
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      };

      const fromB64 = (str) => {
        try {
          let s = str.replace(/-/g, '+').replace(/_/g, '/');
          s += '='.repeat((4 - (s.length % 4)) % 4);
          const bin = atob(s);
          const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
          return JSON.parse(new TextDecoder().decode(bytes));
        } catch {
          return null;
        }
      };

      const hav = (a, b) => {
        const R = 6371;
        const r = (x) => (x * Math.PI) / 180;
        const dLat = r(b.lat - a.lat);
        const dLon = r(b.lon - a.lon);
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      };

      const getMatrix = async (pts) => {
        const fallback = (i, k) => (hav(pts[i], pts[k]) / 40) * 3600;
        try {
          const coords = pts.map((p) => `${p.lon},${p.lat}`).join(';');
          const r = await fetch(
            `https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration`
          );
          const j = await r.json();
          if (j.code !== 'Ok') throw new Error('osrm');
          return pts.map((_, i) => pts.map((_, k) => j.durations[i][k] ?? fallback(i, k)));
        } catch {
          return pts.map((_, i) => pts.map((_, k) => fallback(i, k)));
        }
      };

      const inp =
        'w-full border-2 border-black bg-white px-3 py-2 text-sm outline-none focus:bg-neutral-100';
      const btn =
        'border-2 border-black px-3 py-2 text-xs font-bold uppercase tracking-wider hover:bg-black hover:text-white';

      function AddressInput({ value, onChange, placeholder }) {
        const [q, setQ] = useState(value?.label ?? '');
        const [items, setItems] = useState([]);
        const [open, setOpen] = useState(false);
        const timer = useRef(null);
        const ctrl = useRef(null);

        useEffect(
          () => () => {
            clearTimeout(timer.current);
            ctrl.current?.abort();
          },
          []
        );

        const search = (text) => {
          setQ(text);
          onChange(null);
          clearTimeout(timer.current);
          if (text.trim().length < 3) {
            setItems([]);
            setOpen(false);
            return;
          }
          timer.current = setTimeout(async () => {
            ctrl.current?.abort();
            const c = new AbortController();
            ctrl.current = c;
            try {
              const r = await fetch(
                `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=${encodeURIComponent(text)}`,
                { signal: c.signal }
              );
              const data = await r.json();
              setItems(
                data.map((x) => ({
                  label: x.display_name.split(',').slice(0, 3).join(',').trim(),
                  lat: parseFloat(x.lat),
                  lon: parseFloat(x.lon),
                }))
              );
              setOpen(true);
            } catch (e) {
              if (e.name !== 'AbortError') setItems([]);
            }
          }, 400);
        };

        const pick = (it) => {
          setQ(it.label);
          setItems([]);
          setOpen(false);
          onChange(it);
        };

        return (
          <div className="relative">
            <input
              value={q}
              onChange={(e) => search(e.target.value)}
              onBlur={() => setTimeout(() => setOpen(false), 150)}
              onFocus={() => items.length && setOpen(true)}
              placeholder={placeholder}
              className={inp}
            />
            {open && items.length > 0 && (
              <ul className="absolute z-20 mt-1 w-full border-2 border-black bg-white">
                {items.map((it, k) => (
                  <li key={k}>
                    <button
                      type="button"
                      onMouseDown={(e) => {
                        e.preventDefault();
                        pick(it);
                      }}
                      className="block w-full px-3 py-2 text-left text-xs hover:bg-black hover:text-white"
                    >
                      {it.label}
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        );
      }

      function App() {
        const [s, setS] = useState(() => {
          const init = fromB64(location.hash.slice(1));
          return {
            m: init?.m ?? null,
            t: init?.t ?? '',
            d: init?.d ?? [],
            p: init?.p ?? [],
          };
        });
        const [res, setRes] = useState(null);
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState('');
        const [copied, setCopied] = useState(false);

        useEffect(() => {
          history.replaceState(null, '', '#' + toB64(s));
        }, [s]);

        const patch = (x) => {
          setS((prev) => ({ ...prev, ...x }));
          setRes(null);
          setErr('');
        };
        const upd = (key, id, f) =>
          patch({ [key]: s[key].map((x) => (x.id === id ? { ...x, ...f } : x)) });
        const del = (key, id) => patch({ [key]: s[key].filter((x) => x.id !== id) });

        const copy = async () => {
          try {
            await navigator.clipboard.writeText(location.href);
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
          } catch {}
        };

        const optimize = async () => {
          setErr('');
          const drivers = s.d.filter((d) => d.addr && d.name.trim());
          const pass = s.p.filter((p) => p.addr && p.name.trim());
          if (!s.m) return setErr('Set a match destination.');
          if (!drivers.length) return setErr('Add at least one driver with a name and address.');
          if (!pass.length) return setErr('Add passengers with a name and address.');

          setBusy(true);
          try {
            const pts = [s.m, ...drivers.map((d) => d.addr), ...pass.map((p) => p.addr)];
            const M = await getMatrix(pts);
            const D = drivers.length;

            const pairs = [];
            drivers.forEach((_, i) =>
              pass.forEach((_, j) => {
                const a = i + 1;
                const b = D + 1 + j;
                pairs.push({ i, j, c: M[a][b] + M[b][0] - M[a][0] });
              })
            );
            pairs.sort((x, y) => x.c - y.c);

            const seats = drivers.map((d) => Math.max(0, parseInt(d.seats, 10) || 0));
            const got = drivers.map(() => []);
            const taken = new Set();
            for (const { i, j } of pairs) {
              if (taken.has(j) || got[i].length >= seats[i]) continue;
              got[i].push(j);
              taken.add(j);
            }

            const cards = drivers.map((d, i) => {
              const rem = got[i].map((j) => D + 1 + j);
              const seq = [];
              let cur = i + 1;
              while (rem.length) {
                let bi = 0;
                for (let k = 1; k < rem.length; k++) {
                  if (M[cur][rem[k]] < M[cur][rem[bi]]) bi = k;
                }
                cur = rem[bi];
                seq.push(cur);
                rem.splice(bi, 1);
              }
              let total = 0;
              let prev = i + 1;
              seq.forEach((k) => {
                total += M[prev][k];
                prev = k;
              });
              total += M[prev][0];

              const ps = seq.map((k) => pass[k - D - 1]);
              const wp = ps.map((p) => p.addr.label);
              const url =
                `https://www.google.com/maps/dir/?api=1` +
                `&origin=${encodeURIComponent(d.addr.label)}` +
                `&destination=${encodeURIComponent(s.m.label)}` +
                (wp.length ? `&waypoints=${encodeURIComponent(wp.join('|'))}` : '');

              return {
                id: d.id,
                name: d.name,
                seats: seats[i],
                passengers: ps,
                detour: Math.max(0, Math.round((total - M[i + 1][0]) / 60)),
                url,
              };
            });

            const un = pass.filter((_, j) => !taken.has(j));
            setRes({ cards, un });
          } catch {
            setErr('Routing failed. Try again.');
          } finally {
            setBusy(false);
          }
        };

        return (
          <div className="min-h-screen bg-white font-sans text-black">
            <div className="mx-auto max-w-3xl px-4 py-6">
              <header className="flex items-end justify-between border-b-4 border-black pb-3">
                <h1 className="text-3xl font-black uppercase tracking-tight">Carpool</h1>
                <button onClick={copy} className="text-xs font-bold uppercase underline">
                  {copied ? 'Copied' : 'Copy link'}
                </button>
              </header>

              <section className="mt-6 space-y-3">
                <label className="block text-xs font-bold uppercase tracking-wider">
                  Match destination
                </label>
                <AddressInput
                  value={s.m}
                  onChange={(m) => patch({ m })}
                  placeholder="Stadium or address"
                />
                <input
                  type="datetime-local"
                  value={s.t}
                  onChange={(e) => patch({ t: e.target.value })}
                  className={inp}
                />
              </section>

              <div className="mt-8 grid grid-cols-2 gap-6">
                <div className="space-y-3">
                  <div className="flex items-center justify-between border-b-2 border-black pb-2">
                    <h2 className="text-sm font-black uppercase">Drivers</h2>
                    <button
                      className={btn}
                      onClick={() =>
                        patch({ d: [...s.d, { id: uid(), name: '', addr: null, seats: 3 }] })
                      }
                    >
                      +
                    </button>
                  </div>
                  {s.d.map((d) => (
                    <div key={d.id} className="space-y-2 border-2 border-black p-3">
                      <input
                        className={inp}
                        placeholder="Name"
                        value={d.name}
                        onChange={(e) => upd('d', d.id, { name: e.target.value })}
                      />
                      <AddressInput
                        value={d.addr}
                        onChange={(addr) => upd('d', d.id, { addr })}
                        placeholder="Origin address"
                      />
                      <div className="flex items-center gap-2">
                        <input
                          type="number"
                          min="1"
                          max="8"
                          className={inp}
                          placeholder="Seats"
                          value={d.seats}
                          onChange={(e) => upd('d', d.id, { seats: e.target.value })}
                        />
                        <button className={btn} onClick={() => del('d', d.id)}>
                          ×
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="space-y-3">
                  <div className="flex items-center justify-between border-b-2 border-black pb-2">
                    <h2 className="text-sm font-black uppercase">Passengers</h2>
                    <button
                      className={btn}
                      onClick={() => patch({ p: [...s.p, { id: uid(), name: '', addr: null }] })}
                    >
                      +
                    </button>
                  </div>
                  {s.p.map((p) => (
                    <div key={p.id} className="space-y-2 border-2 border-black p-3">
                      <input
                        className={inp}
                        placeholder="Name"
                        value={p.name}
                        onChange={(e) => upd('p', p.id, { name: e.target.value })}
                      />
                      <AddressInput
                        value={p.addr}
                        onChange={(addr) => upd('p', p.id, { addr })}
                        placeholder="Pickup address"
                      />
                      <button className={btn} onClick={() => del('p', p.id)}>
                        Remove
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <button
                onClick={optimize}
                disabled={busy}
                className="mt-8 w-full bg-black py-4 text-sm font-black uppercase tracking-widest text-white disabled:opacity-40"
              >
                {busy ? 'Optimizing…' : 'Optimize Cars'}
              </button>
              {err && <p className="mt-3 text-sm font-bold">{err}</p>}

              {res && (
                <section className="mt-10">
                  <h2 className="mb-4 border-b-4 border-black pb-2 text-xl font-black uppercase">
                    Routes
                  </h2>
                  <div className="grid gap-4 md:grid-cols-2">
                    {res.cards.map((c) => (
                      <article key={c.id} className="space-y-3 border-4 border-black p-4">
                        <div className="flex items-baseline justify-between">
                          <h3 className="text-lg font-black uppercase">{c.name}</h3>
                          <span className="text-xs font-bold">
                            {c.passengers.length}/{c.seats} seats
                          </span>
                        </div>
                        <p className="text-xs font-bold uppercase">Detour +{c.detour} min</p>
                        {c.passengers.length > 0 ? (
                          <ol className="space-y-1 text-sm">
                            {c.passengers.map((p, k) => (
                              <li key={p.id}>
                                {k + 1}. {p.name}
                              </li>
                            ))}
                          </ol>
                        ) : (
                          <p className="text-sm">No passengers assigned.</p>
                        )}
                        <a
                          href={c.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="block bg-black py-3 text-center text-xs font-bold uppercase tracking-wider text-white"
                        >
                          Open in Google Maps
                        </a>
                      </article>
                    ))}
                  </div>

                  {res.un.length > 0 && (
                    <div className="mt-6 border-2 border-dashed border-black p-4">
                      <h3 className="text-xs font-black uppercase">
                        Unassigned ({res.un.length})
                      </h3>
                      <ul className="mt-2 space-y-1 text-sm">
                        {res.un.map((p) => (
                          <li key={p.id}>
                            {p.name} — {p.addr.label}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </section>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
