<body class="bg-slate-100">

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// Optional: paste a Google Maps JavaScript API key here to use Google Places Autocomplete.
// Leave empty to use the free Photon search.
const GOOGLE_MAPS_API_KEY = '';

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const TOPIC = (id) => `carpool_v1_${id}`;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const randomEventId = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inp = "w-full rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-lg focus:border-blue-600 outline-none";
const btn = "rounded-xl bg-blue-600 px-5 py-3 text-lg font-bold text-white shadow hover:bg-blue-700 disabled:opacity-50";

function loadMine(id) {
  try {
    const m = JSON.parse(localStorage.getItem('carpool_mine_' + id));
    return { cars: m?.cars || [], joins: m?.joins || [] };
  } catch { return { cars: [], joins: [] }; }
}

// Convert ISO string to value usable by datetime-local input
function toLocalInput(iso) {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// Pasted Google Maps link: pull coordinates from "@lat,lng" or "!3d lat!4d lng".
function parseMapsUrl(text) {
  const t = text.trim();
  if (!/google/i.test(t)) return null;
  const m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (!m) return null;
  const place = (t.match(/\/place\/([^/@?]+)/) || [])[1];
  const label = place ? decodeURIComponent(place.replace(/\+/g, ' ')) : `${m[1]}, ${m[2]}`;
  return [{ lat: +m[1], lng: +m[2], label }];
}

// Photon (default, free, no key). Returns GeoJSON features as {lat, lng, label}.
async function photonSearch(q, signal) {
  const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5`, { signal });
  if (!r.ok) throw new Error('Address lookup failed. Check your connection.');
  const j = await r.json();
  return (j.features || []).map(f => {
    const p = f.properties || {};
    const [lng, lat] = f.geometry.coordinates;
    const head = p.street && p.housenumber ? `${p.street} ${p.housenumber}` : (p.name || p.street || '');
    const label = [head, p.city || p.town || p.village || p.county, p.country]
      .filter(Boolean)
      .filter((v, i, a) => a.indexOf(v) === i)
      .join(', ');
    return { lat, lng, label: label || `${lat.toFixed(5)}, ${lng.toFixed(5)}` };
  });
}

// Optional Google Places (used only when GOOGLE_MAPS_API_KEY is set).
let gmapsPromise = null;
function loadGoogle() {
  if (window.google?.maps?.places) return Promise.resolve(window.google);
  if (!gmapsPromise) {
    gmapsPromise = new Promise((res, rej) => {
      window.__cpGmapsReady = () => res(window.google);
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=places&callback=__cpGmapsReady`;
      s.onerror = () => { gmapsPromise = null; rej(new Error('Google Maps failed to load')); };
      document.head.appendChild(s);
    });
  }
  return gmapsPromise;
}

async function googleSearch(q) {
  const g = await loadGoogle();
  const svc = new g.maps.places.AutocompleteService();
  const preds = await new Promise(res =>
    svc.getPlacePredictions({ input: q }, p => res(p || [])));
  const geocoder = new g.maps.Geocoder();
  const resolved = await Promise.all(preds.slice(0, 5).map(p => new Promise(res =>
    geocoder.geocode({ placeId: p.place_id }, (results, status) => {
      if (status === 'OK' && results[0]) {
        res({ lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng(), label: p.description });
      } else res(null);
    }))));
  return resolved.filter(Boolean);
}

// Single entry point used everywhere: returns [{lat, lng, label}, ...]
async function geocode(q, signal) {
  const pasted = parseMapsUrl(q);
  if (pasted) return pasted;
  if (GOOGLE_MAPS_API_KEY) {
    try {
      const g = await googleSearch(q);
      if (g.length) return g;
    } catch {}
  }
  return photonSearch(q, signal);
}

// Publish an action to the event's ntfy topic. Plain-text body = simple CORS request.
async function publish(topic, action) {
  try {
    const r = await fetch(`https://ntfy.sh/${topic}`, { method: 'POST', body: JSON.stringify(action) });
    return r.ok;
  } catch { return false; }
}

// Parse one ntfy envelope (SSE data or NDJSON line) into our action object.
function parseNtfy(str) {
  try {
    const o = JSON.parse(str);
    if (!o || o.event !== 'message' || typeof o.message !== 'string') return null;
    const a = JSON.parse(o.message);
    return isValidAction(a) ? a : null;
  } catch { return null; }
}

function isValidAction(a) {
  return a && typeof a === 'object' && typeof a.id === 'string' && typeof a.t === 'number' && typeof a.type === 'string';
}

/* ------------------------------------------------------------------
   Deterministic reducer: sorted action log -> live state
------------------------------------------------------------------- */
function reduce(actions) {
  let event = null;
  let deleted = false;
  const cars = new Map();
  for (const a of actions) {
    switch (a.type) {
      case 'create':
        if (!event && !deleted && a.dest && Number.isFinite(a.dest.lat)) {
          event = { name: a.name, dest: a.dest, when: a.when };
        }
        break;
      case 'editEvent':
        if (event && !deleted) {
          event = {
            ...event,
            ...(a.name ? { name: a.name } : {}),
            ...(a.dest && Number.isFinite(a.dest.lat) ? { dest: a.dest } : {}),
            ...(a.when ? { when: a.when } : {})
          };
        }
        break;
      case 'deleteEvent':
        deleted = true;
        event = null;
        break;
      case 'addCar': {
        if (cars.has(a.carId)) break;
        if (!Number.isFinite(a.addr?.lat)) break;
        const n = Math.min(7, Math.max(1, parseInt(a.seats, 10) || 1));
        cars.set(a.carId, {
          id: a.carId, driver: a.driver, addr: a.addr,
          seats: Array.from({ length: n }, () => null)
        });
        break;
      }
      case 'join': {
        const c = cars.get(a.carId);
        if (c && a.seatIdx >= 0 && a.seatIdx < c.seats.length && !c.seats[a.seatIdx]) {
          c.seats[a.seatIdx] = { name: a.name, id: a.id };
        }
        break;
      }
      case 'leave': {
        const c = cars.get(a.carId);
        if (c && c.seats[a.seatIdx]) {
          c.seats[a.seatIdx] = null;
        }
        break;
      }
      case 'deleteCar':
        cars.delete(a.carId);
        break;
      case 'editCar': {
        const c = cars.get(a.carId);
        if (!c) break;
        const requested = Math.min(7, Math.max(1, parseInt(a.seats, 10) || c.seats.length));
        let last = -1;
        c.seats.forEach((s, i) => { if (s) last = i; });
        const n = Math.max(requested, last + 1);
        c.seats = Array.from({ length: n }, (_, i) => c.seats[i] || null);
        if (a.driver) c.driver = a.driver;
        if (a.addr && Number.isFinite(a.addr.lat)) c.addr = a.addr;
        break;
      }
    }
  }
  return { event, deleted, cars: [...cars.values()] };
}

/* ------------------------------------------------------------------
   Real-time room hook: cache -> poll history -> SSE live updates
------------------------------------------------------------------- */
function useRoom(eventId) {
  const [actions, setActions] = useState([]);
  const [status, setStatus] = useState('connecting');
  const storeRef = useRef(new Map());
  const topic = TOPIC(eventId);
  const cacheKey = `carpool_cache_${eventId}`;

  const flush = () => {
    const arr = [...storeRef.current.values()].sort((a, b) =>
      a.t - b.t || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    setActions(arr);
    try { localStorage.setItem(cacheKey, JSON.stringify(arr)); } catch {}
  };

  const ingest = (a) => {
    if (!isValidAction(a) || storeRef.current.has(a.id)) return false;
    storeRef.current.set(a.id, a);
    return true;
  };

  useEffect(() => {
    storeRef.current = new Map();
    try { JSON.parse(localStorage.getItem(cacheKey) || '[]').forEach(ingest); } catch {}
    flush();

    let cancelled = false;
    let es = null;
    const start = Math.floor(Date.now() / 1000) - 2;

    (async () => {
      try {
        const r = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=all`);
        if (!r.ok) throw new Error('poll failed');
        const text = await r.text();
        let changed = false;
        text.split('\n').forEach(line => {
          const a = parseNtfy(line);
          if (a && ingest(a)) changed = true;
        });
        if (changed && !cancelled) flush();
        if (!cancelled) setStatus('live');
      } catch {
        if (!cancelled) setStatus('offline');
      }
      if (cancelled) return;

      es = new EventSource(`https://ntfy.sh/${topic}/sse?since=${start}`);
      es.onopen = () => { if (!cancelled) setStatus('live'); };
      es.onmessage = (e) => {
        if (cancelled) return;
        const a = parseNtfy(e.data);
        if (a && ingest(a)) flush();
      };
      es.onerror = () => { if (!cancelled) setStatus('offline'); };
    })();

    return () => { cancelled = true; if (es) es.close(); };
  }, [eventId]);

  // Optimistic local apply, then broadcast.
  const send = (action) => {
    if (ingest(action)) flush();
    return publish(topic, action).then(ok => {
      if (!ok) setStatus('offline');
      return ok;
    });
  };

  return { actions, status, send };
}

/* ------------------------------------------------------------------
   Address autocomplete (Nominatim)
------------------------------------------------------------------- */
function AddressInput({ value, onText, onPick, placeholder }) {
  const [items, setItems] = useState([]);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    if (!open || value.trim().length < 3) { setItems([]); return; }
    const ac = new AbortController();
    const t = setTimeout(async () => {
      try { setItems(await geocode(value, ac.signal)); } catch {}
    }, 350);
    return () => { clearTimeout(t); ac.abort(); };
  }, [value, open]);

  return (
    <div className="relative">
      <input
        className={inp}
        value={value}
        placeholder={placeholder}
        onChange={e => { onText(e.target.value); onPick(null); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      {open && items.length > 0 && (
        <ul className="absolute z-[1000] mt-1 w-full overflow-hidden rounded-xl border bg-white shadow-xl">
          {items.map((it, i) => (
            <li key={i}>
              <button
                type="button"
                className="w-full px-3 py-2 text-left text-sm hover:bg-slate-100"
                onMouseDown={e => e.preventDefault()}
                onClick={() => { onPick(it); onText(it.label); setOpen(false); }}
              >{it.label}</button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   Theme toggle (☀️ / 🌙)
------------------------------------------------------------------- */
function ThemeToggle({ theme, setTheme, className = '' }) {
  const isDark = theme === 'dark';
  return (
    <button
      type="button"
      onClick={() => setTheme(isDark ? 'light' : 'dark')}
      title={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
      className={`rounded-full bg-slate-100 px-3 py-2 text-xl shadow hover:opacity-80 ${className}`}
    >
      {isDark ? '☀️' : '🌙'}
    </button>
  );
}

/* ------------------------------------------------------------------
   Home: create event
------------------------------------------------------------------- */
function Home({ onCreated, theme, setTheme }) {
  const [name, setName] = useState('');
  const [destText, setDestText] = useState('');
  const [dest, setDest] = useState(null);
  const [when, setWhen] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function submit(e) {
    e.preventDefault();
    if (!name.trim() || !when || !destText.trim()) {
      setErr('Please fill in the match name, destination and time.');
      return;
    }
    setBusy(true); setErr('');
    try {
      let d = dest;
      if (!d) {
        const r = await geocode(destText);
        if (!r.length) throw new Error('Destination not found. Try a more specific address.');
        d = r[0];
      }
      const id = randomEventId();
      const action = {
        id: uid(), t: Date.now(), type: 'create',
        name: name.trim().slice(0, 80),
        dest: { lat: d.lat, lng: d.lng, label: d.label },
        when: new Date(when).toISOString()
      };
      try { localStorage.setItem(`carpool_cache_${id}`, JSON.stringify([action])); } catch {}
      await publish(TOPIC(id), action);
      indexPublish(id, { name: action.name, when: action.when, dest: action.dest, deleted: false });
      onCreated(id);
    } catch (ex) {
      setErr(ex.message || 'Could not create event.');
      setBusy(false);
    }
  }

  return (
    <div className="relative min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-600 to-emerald-500">
      <ThemeToggle theme={theme} setTheme={setTheme} className="absolute right-4 top-4" />
      <form onSubmit={submit} className="w-full max-w-lg rounded-3xl bg-white p-8 shadow-2xl space-y-5">
        <div>
          <h1 className="text-4xl font-black">🦁 Carpool Map</h1>
          <p className="mt-2 text-slate-600 text-lg">Create a match event, then share the link so everyone can add cars and seats.</p>
        </div>
        <div>
          <label className="block font-bold mb-1">Match name</label>
          <input className={inp} value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Real Madrid vs Barça" />
        </div>
        <div>
          <label className="block font-bold mb-1">Destination</label>
          <AddressInput value={destText} onText={setDestText} onPick={setDest} placeholder="Stadium or venue address" />
        </div>
        <div>
          <label className="block font-bold mb-1">Date and time</label>
          <input type="datetime-local" className={inp} value={when} onChange={e => setWhen(e.target.value)} />
        </div>
        {err && <p className="rounded-xl bg-red-100 p-3 font-semibold text-red-700">{err}</p>}
        <button type="submit" disabled={busy} className={btn + " w-full"}>
          {busy ? 'Creating…' : 'Create Event'}
        </button>
      </form>
    </div>
  );
}

/* ------------------------------------------------------------------
   Leaflet map
------------------------------------------------------------------- */
function RoomMap({ dest, cars, highlight, onPick }) {
  const boxRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const fitKeyRef = useRef('');

  useEffect(() => {
    if (!window.L || mapRef.current) return;
    const map = window.L.map(boxRef.current).setView([40.4168, -3.7038], 5);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    mapRef.current = map;
    layerRef.current = window.L.layerGroup().addTo(map);
  }, []);

  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const pts = [];

    if (dest) {
      const label = esc(dest.label.split(',').slice(0, 2).join(','));
      layer.addLayer(window.L.marker([dest.lat, dest.lng], {
        icon: window.L.divIcon({
          className: 'cp-pin',
          html: `<div class="cp-dest">🏟 ${label}</div>`,
          iconSize: [0, 0], iconAnchor: [0, 0]
        })
      }));
      pts.push([dest.lat, dest.lng]);
    }

    cars.forEach(car => {
      const hl = car.id === highlight;
      const marker = window.L.marker([car.addr.lat, car.addr.lng], {
        icon: window.L.divIcon({
          className: 'cp-pin',
          html: `<div class="cp-label ${hl ? 'cp-hl' : ''}">🦁 ${esc(car.driver)}</div>`,
          iconSize: [0, 0], iconAnchor: [0, 0]
        })
      });
      marker.on('click', () => onPick(car.id));
      layer.addLayer(marker);
      pts.push([car.addr.lat, car.addr.lng]);
    });

    // Only refit when the set of locations changes, not on every highlight.
    const key = pts.map(p => p.join(',')).join(';');
    if (pts.length && key !== fitKeyRef.current) {
      fitKeyRef.current = key;
      if (pts.length === 1) map.setView(pts[0], 13);
      else map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
    }
  }, [dest, cars, highlight]);

  return <div ref={boxRef} className="h-[420px] w-full rounded-2xl overflow-hidden shadow-lg" />;
}

/* ------------------------------------------------------------------
   Car card
------------------------------------------------------------------- */
function CarCard({ car, highlighted, onJoin, onLeave, onRemove, onEdit }) {
  const free = car.seats.filter(s => !s).length;
  const [editing, setEditing] = useState(false);
  const [driver, setDriver] = useState(car.driver);
  const [addrText, setAddrText] = useState(car.addr.label);
  const [addr, setAddr] = useState(null);
  const [seats, setSeats] = useState(car.seats.length);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function saveEdit(e) {
    e.preventDefault();
    if (!driver.trim() || !addrText.trim()) { setErr('Driver name and address are required.'); return; }
    setBusy(true); setErr('');
    try {
      let a = addr;
      if (!a || a.label !== addrText) {
        const r = await geocode(addrText);
        if (!r.length) throw new Error('Address not found. Try a more specific address.');
        a = r[0];
      }
      await onEdit(car, { driver: driver.trim().slice(0, 40), addr: { lat: a.lat, lng: a.lng, label: a.label }, seats });
      setEditing(false);
    } catch (ex) {
      setErr(ex.message || 'Could not save changes.');
    }
    setBusy(false);
  }

  return (
    <div
      id={`car-${car.id}`}
      className={`rounded-3xl bg-white p-6 shadow-lg border-4 transition ${highlighted ? 'border-orange-500' : 'border-transparent'}`}
    >
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <p className="text-sm font-bold uppercase tracking-wide text-slate-500">Driver</p>
          <h3 className="text-3xl font-black break-words">🚗 {car.driver}</h3>
        </div>
        <div className="flex shrink-0 gap-3">
          <button type="button" onClick={() => setEditing(!editing)} className="text-sm font-semibold text-blue-600 underline">{editing ? 'Cancel' : 'Edit car'}</button>
          <button type="button" onClick={() => onRemove(car)} className="text-sm font-semibold text-red-600 underline">Remove car</button>
        </div>
      </div>
      {editing && (
        <form onSubmit={saveEdit} className="mt-4 space-y-3 rounded-2xl bg-slate-50 p-4">
          <input className={inp} value={driver} onChange={e => setDriver(e.target.value)} placeholder="Driver name" />
          <AddressInput value={addrText} onText={setAddrText} onPick={setAddr} placeholder="Departure address" />
          <select className={inp} value={seats} onChange={e => setSeats(+e.target.value)}>
            {[1, 2, 3, 4, 5, 6, 7].map(n => <option key={n} value={n}>{n} seat{n > 1 ? 's' : ''}</option>)}
          </select>
          {err && <p className="rounded-xl bg-red-100 p-3 font-semibold text-red-700">{err}</p>}
          <button type="submit" disabled={busy} className={btn + " w-full"}>{busy ? 'Saving…' : 'Save car'}</button>
        </form>
      )}
      <p className="mt-3 text-base text-slate-700 break-words">📍 {car.addr.label}</p>
      <p className={`mt-4 text-lg font-extrabold ${free ? 'text-emerald-700' : 'text-red-600'}`}>
        {free ? `${free} seat${free > 1 ? 's' : ''} free` : 'Full'}
      </p>
      <div className="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-3">
        <div className="flex items-center justify-center rounded-2xl bg-blue-600 p-4 text-lg font-bold text-white">
          🧑‍✈️ Driver
        </div>
        {car.seats.map((s, i) => s ? (
          <div key={i} className="flex items-center justify-between gap-2 rounded-2xl border-2 border-emerald-500 bg-emerald-100 p-4">
            <span className="truncate text-lg font-bold">👤 {s.name}</span>
            <button type="button" onClick={() => onLeave(car, i)} className="shrink-0 rounded-lg bg-white px-2 py-1 text-sm font-bold text-red-600 shadow">Remove</button>
          </div>
        ) : (
          <button
            key={i}
            onClick={() => onJoin(car, i)}
            className="rounded-2xl border-2 border-dashed border-slate-400 p-4 text-lg font-bold text-slate-600 hover:border-blue-600 hover:bg-blue-50"
          >+ Join</button>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
   Add car form
------------------------------------------------------------------- */
function AddCarForm({ onAdd }) {
  const [driver, setDriver] = useState('');
  const [addrText, setAddrText] = useState('');
  const [addr, setAddr] = useState(null);
  const [seats, setSeats] = useState(3);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function submit(e) {
    e.preventDefault();
    if (!driver.trim() || !addrText.trim()) {
      setErr('Driver name and departure address are required.');
      return;
    }
    setBusy(true); setErr('');
    try {
      let a = addr;
      if (!a) {
        const r = await geocode(addrText);
        if (!r.length) throw new Error('Address not found. Try a more specific address.');
        a = r[0];
      }
      onAdd({ driver: driver.trim(), addr: { lat: a.lat, lng: a.lng, label: a.label }, seats });
      setDriver(''); setAddrText(''); setAddr(null); setSeats(3);
    } catch (ex) {
      setErr(ex.message || 'Could not add car.');
    }
    setBusy(false);
  }

  return (
    <form onSubmit={submit} className="space-y-4 rounded-3xl bg-white p-6 shadow-lg lg:sticky lg:top-24">
      <h2 className="text-2xl font-black">+ Add Car</h2>
      <div>
        <label className="mb-1 block font-bold">Driver name</label>
        <input className={inp} value={driver} onChange={e => setDriver(e.target.value)} placeholder="Your name" />
      </div>
      <div>
        <label className="mb-1 block font-bold">Departure address</label>
        <AddressInput value={addrText} onText={setAddrText} onPick={setAddr} placeholder="Where you pick people up" />
      </div>
      <div>
        <label className="mb-1 block font-bold">Passenger seats</label>
        <select className={inp} value={seats} onChange={e => setSeats(+e.target.value)}>
          {[1, 2, 3, 4, 5, 6, 7].map(n => <option key={n} value={n}>{n} seat{n > 1 ? 's' : ''}</option>)}
        </select>
      </div>
      {err && <p className="rounded-xl bg-red-100 p-3 font-semibold text-red-700">{err}</p>}
      <button type="submit" disabled={busy} className={btn + " w-full"}>
        {busy ? 'Adding…' : 'Add Car'}
      </button>
    </form>
  );
}

/* ------------------------------------------------------------------
   Edit / Delete event section
------------------------------------------------------------------- */
function EventEditor({ event, onSave, onDelete }) {
  const [name, setName] = useState(event.name);
  const [destText, setDestText] = useState(event.dest.label);
  const [dest, setDest] = useState(null);
  const [when, setWhen] = useState(toLocalInput(event.when));
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [saved, setSaved] = useState(false);

  async function save(e) {
    e.preventDefault();
    if (!name.trim() || !when || !destText.trim()) {
      setErr('Match name, destination and time are required.');
      return;
    }
    setBusy(true); setErr('');
    try {
      let d = dest;
      if (!d && destText.trim() !== event.dest.label) {
        const r = await geocode(destText);
        if (!r.length) throw new Error('Destination not found. Try a more specific address.');
        d = r[0];
      }
      const changes = {
        name: name.trim().slice(0, 80),
        when: new Date(when).toISOString()
      };
      if (d) changes.dest = { lat: d.lat, lng: d.lng, label: d.label };
      await onSave(changes);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (ex) {
      setErr(ex.message || 'Could not save changes.');
    }
    setBusy(false);
  }

  return (
    <form onSubmit={save} className="space-y-4 rounded-3xl bg-white p-6 shadow-lg">
      <h2 className="text-2xl font-black">✏️ Edit Event</h2>
      <div>
        <label className="mb-1 block font-bold">Match name</label>
        <input className={inp} value={name} onChange={e => setName(e.target.value)} />
      </div>
      <div>
        <label className="mb-1 block font-bold">Destination</label>
        <AddressInput value={destText} onText={setDestText} onPick={setDest} placeholder="Stadium or venue address" />
      </div>
      <div>
        <label className="mb-1 block font-bold">Date and time</label>
        <input type="datetime-local" className={inp} value={when} onChange={e => setWhen(e.target.value)} />
      </div>
      {err && <p className="rounded-xl bg-red-100 p-3 font-semibold text-red-700">{err}</p>}
      <div className="flex flex-col gap-3">
        <button type="submit" disabled={busy} className={btn + " w-full"}>
          {busy ? 'Saving…' : saved ? 'Saved!' : 'Save Changes'}
        </button>
        <button
          type="button"
          onClick={onDelete}
          className="w-full rounded-xl bg-red-600 px-5 py-3 text-lg font-bold text-white shadow hover:bg-red-700"
        >Delete Event</button>
      </div>
    </form>
  );
}

/* ------------------------------------------------------------------
   Room: live event page
------------------------------------------------------------------- */
function Room({ eventId, theme, setTheme }) {
  const { actions, status, send } = useRoom(eventId);
  const { event, deleted, cars } = useMemo(() => reduce(actions), [actions]);
  const [mine, setMine] = useState(() => loadMine(eventId));
  const [highlight, setHighlight] = useState(null);
  const [copied, setCopied] = useState(false);

  const updateMine = (m) => {
    setMine(m);
    try { localStorage.setItem('carpool_mine_' + eventId, JSON.stringify(m)); } catch {}
  };

  const copy = async () => {
    const url = window.location.href;
    try {
      await navigator.clipboard.writeText(url);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      window.prompt('Copy this link:', url);
    }
  };

  const pickOnMap = (carId) => {
    setHighlight(carId);
    const el = document.getElementById(`car-${carId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  const addCar = ({ driver, addr, seats }) => {
    const carId = uid();
    send({ id: uid(), t: Date.now(), type: 'addCar', carId, driver: driver.slice(0, 40), addr, seats });
    updateMine({ ...mine, cars: [...mine.cars, carId] });
  };

  const join = (car, idx) => {
    const name = window.prompt('Passenger name?');
    if (!name || !name.trim()) return;
    const joinId = uid();
    send({ id: joinId, t: Date.now(), type: 'join', carId: car.id, seatIdx: idx, name: name.trim().slice(0, 40) });
    updateMine({ ...mine, joins: [...mine.joins, joinId] });
  };

  const leave = (car, idx) => {
    const s = car.seats[idx];
    if (!s) return;
    send({ id: uid(), t: Date.now(), type: 'leave', carId: car.id, seatIdx: idx, joinId: s.id });
    updateMine({ ...mine, joins: mine.joins.filter(j => j !== s.id) });
  };

  const removeCar = (car) => {
    if (!window.confirm(`Remove ${car.driver}'s car?`)) return;
    send({ id: uid(), t: Date.now(), type: 'deleteCar', carId: car.id });
    updateMine({ ...mine, cars: mine.cars.filter(c => c !== car.id) });
  };

  const editCar = (car, changes) => send({ id: uid(), t: Date.now(), type: 'editCar', carId: car.id, ...changes });

  const saveEvent = (changes) => {
    indexPublish(eventId, { name: changes.name, when: changes.when, dest: changes.dest || event.dest, deleted: false });
    return send({ id: uid(), t: Date.now(), type: 'editEvent', ...changes });
  };

  const deleteEvent = () => {
    if (!window.confirm('Delete this event for everyone? This cannot be undone.')) return;
    indexPublish(eventId, { name: event.name, when: event.when, dest: event.dest, deleted: true });
    send({ id: uid(), t: Date.now(), type: 'deleteEvent' });
  };

  const pill = {
    live: ['bg-emerald-500', 'Live'],
    connecting: ['bg-amber-400', 'Connecting…'],
    offline: ['bg-red-500', 'Offline (cached)']
  }[status];

  const whenText = event ? new Date(event.when).toLocaleString(undefined, {
    weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
  }) : '';

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      <header className="sticky top-0 z-[500] bg-white shadow">
        <div className="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4">
          <div className="min-w-0">
            <h1 className="truncate text-2xl font-extrabold sm:text-3xl">
              🦁 {event ? event.name : deleted ? 'Event deleted' : 'Loading match…'}
            </h1>
            {event && (
              <p className="text-slate-600">
                📍 {event.dest.label.split(',').slice(0, 2).join(',')} · 🕒 {whenText}
              </p>
            )}
          </div>
          <div className="flex items-center gap-2">
            <span className="flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-sm font-semibold">
              <span className={`inline-block h-3 w-3 rounded-full ${pill[0]}`}></span>{pill[1]}
            </span>
            <ThemeToggle theme={theme} setTheme={setTheme} />
            {!deleted && <button onClick={copy} className={btn}>{copied ? 'Copied!' : 'Copy Link'}</button>}
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-6xl space-y-6 p-4">
        {deleted ? (
          <div className="rounded-3xl bg-white p-10 text-center shadow-lg">
            <p className="text-3xl font-black">This event was deleted.</p>
            <p className="mt-2 text-lg text-slate-500">Create a new match from the home page.</p>
            <a href={window.location.pathname} className={btn + " mt-6 inline-block no-underline"}>Create new event</a>
          </div>
        ) : event ? (
          <RoomMap dest={event.dest} cars={cars} highlight={highlight} onPick={pickOnMap} />
        ) : (
          <div className="flex h-[200px] items-center justify-center rounded-2xl bg-white text-lg text-slate-500 shadow">
            {status === 'offline' ? 'Event not found or you are offline.' : 'Connecting to event…'}
          </div>
        )}

        {!deleted && (
          <div className="grid gap-6 lg:grid-cols-3">
            <section className="space-y-6 lg:col-span-2">
              {cars.length === 0 && (
                <div className="rounded-3xl bg-white p-8 text-center text-lg text-slate-500 shadow">
                  No cars yet. Add the first one!
                </div>
              )}
              {cars.map(car => (
                <CarCard
                  key={car.id}
                  car={car}
                  highlighted={highlight === car.id}
                  onJoin={join}
                  onLeave={leave}
                  onRemove={removeCar}
                  onEdit={editCar}
                />
              ))}
            </section>
            <aside className="space-y-6 lg:col-span-1">
              <AddCarForm onAdd={addCar} />
              {event && <EventEditor key={eventId} event={event} onSave={saveEvent} onDelete={deleteEvent} />}
            </aside>
          </div>
        )}
      </main>
    </div>
  );
}

/* ------------------------------------------------------------------
   App: routing by ?event=<id>, theme persisted in localStorage
------------------------------------------------------------------- */
/* ------------------------------------------------------------------
   Shared index of events (so every live event can be listed)
------------------------------------------------------------------- */
const INDEX_TOPIC = 'carpool_v1_index';

function indexPublish(eventId, data) {
  return publish(INDEX_TOPIC, { id: uid(), t: Date.now(), type: 'indexEvent', eventId, ...data });
}

function sendEventAction(eventId, action) {
  return publish(TOPIC(eventId), { id: uid(), t: Date.now(), ...action });
}

// Subscribes to the index topic. Keeps the latest record per event.
function useIndex() {
  const [items, setItems] = useState(new Map());
  useEffect(() => {
    let cancelled = false;
    let es = null;
    const seen = new Map();
    const apply = (a) => {
      if (!a || a.type !== 'indexEvent') return;
      const prev = seen.get(a.eventId);
      if (!prev || a.t >= prev.t) seen.set(a.eventId, a);
    };
    const flush = () => { if (!cancelled) setItems(new Map(seen)); };

    (async () => {
      try {
        const r = await fetch(`https://ntfy.sh/${INDEX_TOPIC}/json?poll=1&since=all`);
        const text = await r.text();
        text.split('\n').forEach(line => apply(parseNtfy(line)));
        flush();
      } catch {}
      if (cancelled) return;
      es = new EventSource(`https://ntfy.sh/${INDEX_TOPIC}/sse?since=${Math.floor(Date.now() / 1000) - 2}`);
      es.onmessage = (e) => { const a = parseNtfy(e.data); if (a) { apply(a); flush(); } };
    })();

    return () => { cancelled = true; if (es) es.close(); };
  }, []);
  return items;
}

// Live events list with inline editing and deletion.
function EventsTab({ onOpen }) {
  const items = useIndex();
  const [editing, setEditing] = useState(null);
  const live = [...items.values()]
    .filter(r => !r.deleted)
    .sort((a, b) => new Date(a.when) - new Date(b.when));

  const saveRemote = (ev, changes) => {
    const dest = changes.dest || ev.dest;
    sendEventAction(ev.eventId, { type: 'editEvent', ...changes });
    return indexPublish(ev.eventId, { name: changes.name, when: changes.when, dest, deleted: false });
  };

  const deleteRemote = (ev) => {
    if (!window.confirm('Delete this event for everyone? This cannot be undone.')) return;
    sendEventAction(ev.eventId, { type: 'deleteEvent' });
    indexPublish(ev.eventId, { name: ev.name, when: ev.when, dest: ev.dest, deleted: true });
  };

  return (
    <div className="mx-auto max-w-4xl space-y-4 p-4">
      <h2 className="text-3xl font-black">📋 Live events</h2>
      {live.length === 0 && (
        <div className="rounded-3xl bg-white p-8 text-center text-lg text-slate-500 shadow">
          No live events yet. Create one from the Create event tab.
        </div>
      )}
      {live.map(ev => (
        <div key={ev.eventId} className="space-y-3 rounded-3xl bg-white p-6 shadow-lg">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="min-w-0">
              <p className="break-words text-2xl font-black">🦁 {ev.name}</p>
              <p className="text-slate-600">
                📍 {ev.dest.label.split(',').slice(0, 2).join(',')} · 🕒 {new Date(ev.when).toLocaleString(undefined, {
                  weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                })}
              </p>
            </div>
            <div className="flex gap-2">
              <button type="button" className={btn} onClick={() => onOpen(ev.eventId)}>Open</button>
              <button type="button" className={btn} onClick={() => setEditing(editing === ev.eventId ? null : ev.eventId)}>
                {editing === ev.eventId ? 'Close' : 'Edit'}
              </button>
            </div>
          </div>
          {editing === ev.eventId && (
            <EventEditor
              key={ev.eventId}
              event={ev}
              onSave={(changes) => saveRemote(ev, changes)}
              onDelete={() => deleteRemote(ev)}
            />
          )}
        </div>
      ))}
    </div>
  );
}

function App() {
  const [eventId, setEventId] = useState(() => new URLSearchParams(window.location.search).get('event'));
  const [tab, setTab] = useState('main');
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('carpool_theme') === 'dark' ? 'dark' : 'light'; } catch { return 'light'; }
  });

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem('carpool_theme', theme); } catch {}
  }, [theme]);

  useEffect(() => {
    const onPop = () => setEventId(new URLSearchParams(window.location.search).get('event'));
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const goCreate = () => {
    window.history.pushState({}, '', window.location.pathname);
    setEventId(null);
    setTab('main');
  };
  const openEvent = (id) => {
    window.history.pushState({}, '', `?event=${id}`);
    setEventId(id);
    setTab('main');
  };

  const navBtn = "rounded-lg bg-white/10 px-4 py-2 font-bold text-white hover:bg-white/20";
  const nav = (
    <nav className="flex flex-wrap justify-center gap-2 bg-slate-800 p-2">
      <button type="button" className={navBtn} onClick={goCreate}>➕ Create event</button>
      <button type="button" className={navBtn} onClick={() => setTab('events')}>📋 Live events</button>
    </nav>
  );

  let content;
  if (tab === 'events') {
    content = <EventsTab onOpen={openEvent} />;
  } else if (eventId) {
    content = <Room key={eventId} eventId={eventId} theme={theme} setTheme={setTheme} />;
  } else {
    content = (
      <Home
        theme={theme}
        setTheme={setTheme}
        onCreated={(id) => {
          window.history.pushState({}, '', `?event=${id}`);
          setEventId(id);
        }}
      />
    );
  }

  return (
    <>
      {nav}
      {content}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
